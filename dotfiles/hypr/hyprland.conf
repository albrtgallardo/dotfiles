
# programas que se inician al arrancar
exec-once = hyprpaper
exec-once = waybar
exec-once = xwaylandvideobridge


#=============== MONITOR ===============

monitor = eDP-1, 1366x768, 0x0, 1


#=============== VARIABLES ===============

general {
    border_size = 3                  # grosor de borde
    gaps_in = 3                      # espacio entre ventanas
    gaps_out = 5                     # espacio entre ventanas y borde de pantalla
    col.active_border = 0xff0e6879   # color borde ventana activa
    col.inactive_border = 0xffb57213 # color borde ventana inactiva
    resize_on_border = true	     # ajuste de las ventanas arrastrando y clicando
    extend_border_grab_area = 15     # extiende el area alrededor del borde donde se puede clicar para el resize
   
    snap {
	enabled = true		     # snap es para que las ventanas flotantes tengan un margen forzado
	window_gap = 10		     # numero de pixeles minimos entre ventanas
	monitor_gap = 10	     # numero de pixeles minimos entre ventanas y el monitor
    }
}


decoration {
    rounding = 10                 # bordes redondeados en píxeles
    active_opacity = 1.0 	  
    inactive_opacity = 0.95 	  # pequeña transparencia para las ventanas inactivas

    blur {			 
	enabled = false  	  # enabled in case wanted
	size = 7		  # cuanto de blur quieres en tu blur?
        passes = 3		  # stride, los pasos del kernel del blur
	ignore_opacity = true	  # make the blur layer ignore the opacity of the window 
	
	noise = 0.08		  # float [0.0, 1.0] cuanto ruido
	contrast = 2		  # float [0.0, 2.0] contraste
	brightness = 0.7	  # float [0.0, 2.0] el brillo, ideal para temas claros
	#vibrancy =  		# float [0.0, 1.0] saturacion de los colores
	
	special = false 	  # if true blurea todo el fondo cuando tienes una ventana flotante, pero es costoso
	xray = true		  # se usa para que el blur tome siempre el wallpaper y no la ventana de detras
    }

    shadow{
        enabled = false
        sharp = false
    }
}


input {
    #teclado
    kb_layout = us, es
    #kb_variant = deadkeys
    kb_options = grp:win_space_toggle
    
    #raton 
    sensitivity = 0.0		# sensibilidad del raton
    accel_profile = flat	# aceleracion del raton
    follow_mouse = 1		# si el foco de las ventanas sigue al raton 0 click, 1 pasar, 2 pasar pero mas agresivo
}

#melon para otro momento, puede ser util para alternar ventanas dentro okular por ejemplo
#group {

#}

# aqui se puede jugar mas
misc {
    disable_hyprland_logo = true 	# :(
    disable_splash_rendering = true
}



#=============== BINDINGS ===============

# --- tecla de super ---
$mod = SUPER

# --- terminal ---
$term = kitty

# --- moverse entre workspaces ---
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# --- mover ventanas entre workspaces ---
bind = $mod+shift, 1, movetoworkspace, 1
bind = $mod+shift, 2, movetoworkspace, 2
bind = $mod+shift, 3, movetoworkspace, 3
bind = $mod+shift, 4, movetoworkspace, 4
bind = $mod+shift, 5, movetoworkspace, 5
bind = $mod+shift, 6, movetoworkspace, 6
bind = $mod+shift, 7, movetoworkspace, 7
bind = $mod+shift, 8, movetoworkspace, 8
bind = $mod+shift, 9, movetoworkspace, 9
bind = $mod+shift, 0, movetoworkspace, 10

# --- Navegación entre ventanas con flechas ---
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# --- Mover ventanas con flechas ---
bind = $mod+shift, left, movewindow, l
bind = $mod+shift, right, movewindow, r
bind = $mod+shift, up, movewindow, u
bind = $mod+shift, down, movewindow, d



#  --- atajos de teclado ---
bind = $mod, W, killactive			# close window
bind = $mod, F, fullscreen, 0			# fullscreen
bind = $mod, G, togglefloating			# floating
bind = $mod+shift, L, exec, hyprlock		# lock

bind = $mod, D, exec, rofi -show drun		# app launcher
bind = $mod+shift, D, exec, pkill nemo || nemo  # nemo, alterna entre abierto y cerrado
bind = $mod, RETURN, exec, $term		# terminal
bind = $mod+shift, S, exec, flameshot gui 	# screenshot
#bind = $mod+shift, F, exec, firefox		# firefox
bind = $mod+shift, F, exec, zen-browser  	# zen-browser
bind = $mod+shift, M, exec, lollypop

# --- utilities ---
#bind[flags] -> l locked, r repeat
bindlr = alt, up, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindlr = alt, down, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindlr = alt, M, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# --- rules ---
# Descargador de ventanas
windowrule {
    name = youtubeDownloader
    match:class = Tk
    float = on
    center = on
    size = 560 360
}

windowrule {
   name = nemo
   match:class = nemo
   float = on
   center = on
   size = 728 468
}

